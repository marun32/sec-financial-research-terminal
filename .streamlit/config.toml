[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#E9EEF3"
textColor = "#172033"
font = "sans serif"

[client]
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
# Avoid Streamlit introspecting the large transformers module tree used by the reranker.
fileWatcherType = "none"

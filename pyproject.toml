[project]
name = "sec-financial-research-terminal"
version = "0.1.0"
description = "SEC-grounded financial research terminal with comparative RAG evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "langgraph>=1.0",
  "langsmith>=0.4",
  "lxml>=5.3",
  "numpy>=2.0",
  "openai>=1.70",
  "pandas>=2.2",
  "pinecone>=7.0",
  "plotly>=6.0",
  "pyarrow>=18.0",
  "python-dotenv>=1.0",
  "sentence-transformers>=3.4",
  "streamlit>=1.42",
  "tenacity>=9.0",
  "tqdm>=4.67",
  "transformers>=5.20",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
finrag = "sec_fin_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_fin_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
